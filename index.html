<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <link href="/favicon.ico" rel="icon">

    <!-- ✅ 모바일 필수: viewport 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>삼육서울병원 추모관</title>
    <meta content="삼육서울병원 추모관" name="keywords" />
    <meta content="website" property="og:type">

    <!-- ✅ iOS 웹앱 관련 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="추모관">

    <!-- ✅ 전화번호 자동 링크 방지 (필요 시 제거) -->
    <meta name="format-detection" content="telephone=no">

    <!-- css -->
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- jq -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

    <script>
        $(function () {
            $('body').removeClass('no-scroll');

            // 모바일 nav 토글
            $('.nav_open').click(function () {
                $(this).toggleClass('active');
                $('nav > ul').toggleClass('open');

                if ($(this).hasClass('active')) {
                    $('body').addClass('no-scroll');
                } else {
                    $('body').removeClass('no-scroll');
                }
            });
        });
    </script>
</head>

<body>
    <div id="wrap">
        <div class="admin">
            <div class="adm_login_wrap">
                <div class="login_form">
                    <h1 class="logo">
                        <a href="index.html"><img src="images/logo.svg" alt="삼육서울병원 추모관"></a>
                    </h1>
                    <h2>ADMINISTRATOR LOGIN</h2>
                    <div class="login_box">
                        <div class="login_box_input">
                            <input type="text" placeholder="아이디">
                            <input type="password" placeholder="비밀번호">
                        </div>
                        <input type="submit" class="login_btn" value="로그인">
                    </div>
                    <p>Copyrights Ministry of environment. All Right Reserved.</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
